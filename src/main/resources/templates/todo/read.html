<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/main/main.css">
    <title>Home</title>
</head>
<body>
<div id="app">
    <header th:replace="~{./fragment/header.html}"></header>
    <nav th:replace="~{./fragment/nav.html}"></nav>
    <main>
        <aside th:replace="~{./fragment/aside.html}"></aside>
        <section>
            <form action="/todo/update" method="post">
                <table class="table">
                    <tr>
                        <td>제목</td>
                        <td th:text="${todo.title}"></td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <textarea class="form-control" rows="5" name="memo" th:text="${todo.memo}"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td>작성일</td>
                        <td><input type="date" name="title" th:value="${todo.regDate}"></td>
                    </tr>
                    <tr>
                        <td>마감일</td>
                        <td><input type="date" name="title" th:value="${todo.deadline}"></td>
                    </tr>
                    <tr>
                        <td>완료</td>
                        <td>
                            <input th:text="${todo.finish==1? '작업완료':' '}">
                        </td>
                    </tr>
                </table>
                <input type="hidden" name="tno" th:value="${todo.tno}">
                <button class="btn btn-primary">변경하기</button>
            </form>
            <form action="/todo/finish" method="post" class="mt-3">
                <input type="hidden" name="tno" th:value="${todo.tno}">
                <input type="hidden" name="finish" value="1"> <!-- ✅ 이 줄 추가 -->
                <button class="btn btn-success">완료하기</button>
            </form>
            <form action="/todo/delete" method="post" class="mt-3">
                <input type="hidden" name="tno" th:value="${todo.tno}">
                <button class="btn btn-danger">삭제하기</button>
            </form>
        </section>
        <aside th:replace="~{./fragment/aside.html}"></aside>
    </main>
    <footer th:replace="~{./fragment/footer.html}"></footer>
</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/todo/main.css">
    <title>Home</title>
</head>
<body>
<div id="app">
    <header th:replace="~{./fragment/header.html}"></header>
    <nav th:replace="~{./fragment/nav.html}"></nav>

    <main>
        <aside th:replace="~{./fragment/aside.html}"></aside>
        <section>

            <table class="table table-border">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>내용</th>
                    <th>작성일</th>
                    <th>마감일</th>
                    <th>완료</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="todo : ${todos}">
                    <td th:text="${todo.tno}"></td>
                    <td><a th:href="'/todo/read?tno=' + ${todo.tno}" th:text="${todo.title}"></a></td>
                    <td th:text="${todo.memo}"></td>
                    <td th:text="${todo.regDate}"></td>
                    <td th:text="${todo.deadline}"></td>
                    <td th:text="${todo.finish}"></td> <!-- ✅ 닫는 중괄호 추가 -->
                </tr>
                </tbody>
            </table>
            <div class="mt-3">
                <a type="button" class="btn btn-success" href="/todo/write">글 작성으로</a>
            </div>
        </section>
    </main>

    <footer th:replace="~{./fragment/footer.html}"></footer>
</div>
</body>

</html>

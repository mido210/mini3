<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/contact/main.css" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<div id = "app">
  <header th:replace="~{./fragment/header.html}"></header>
  <nav th:replace="~{./fragment/nav.html}"></nav>
  <main>
    <aside th:replace="~{./fragment/aside.html}"></aside>
    <section>
      <form action="/contact/update" method="post">
        <table class="table">
          <tr>
            <td>이름</td>
            <td th:text="${contact.name}"></td>
          </tr>
          <tr>
            <td>연락처</td>
            <td> <input type="text" name="tel" th:value="${contact.tel}"></td>
          </tr>
          <tr>
            <td>주소</td>
            <td> <input name="address" th:value="${contact.address}" type="text"> </td>
          </tr>
        </table>
        <input type="hidden" name="cno" th:value="${contact.cno}">
        <button class="btn btn-success">변경하기</button>
      </form>
      <form action="/contact/delete" method="post" class="mt-3">
        <input type="hidden" name="cno" th:value="${contact.cno}">
        <button class="btn btn-dark">삭제</button>
      </form>
    </section>
    <aside th:replace="~{./fragment/aside.html}"></aside>
  </main>
  <footer th:replace="~{./fragment/footer.html}"></footer>
</div>
</body>
</html>

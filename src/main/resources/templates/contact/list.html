<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/contact/main.css" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Contact</title>
</head>
<body>
<div id = "app">
  <header th:replace="~{./fragment/header.html}"></header>
  <nav th:replace="~{./fragment/nav.html}"></nav>
  <main>
    <aside th:replace="~{./fragment/aside.html}"></aside>
    <section>
      <table class="table table-border">
        <thead>
          <tr>
            <th>no</th>
            <th>이름</th>
            <th>주소</th>
            <th>전화번호</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="contact:${contacts}">
            <td th:text="${contact.cno}"></td>
            <td>
              <a th:href="'/contact/read?cno=' + ${contact.cno}" th:text="${contact.name}"></a>
            </td>
            <td th:text="${contact.address}"></td>
            <td th:text="${contact.tel}"></td>
          </tr>
        </tbody>
      </table>
      <div class="mt-5 mb-5">
        <a type="button" class="btn btn-secondary" href="/contact/write">Add Contacts</a>
      </div>
    </section>
    <aside th:replace="~{./fragment/aside.html}"></aside>
  </main>
  <footer th:replace="~{./fragment/footer.html}"></footer>
</div>
</body>
</html>

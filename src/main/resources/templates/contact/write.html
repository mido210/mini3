<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/contact/main.css" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<div id = "app">
  <header th:replace="~{./fragment/header.html}"></header>
  <nav th:replace="~{./fragment/nav.html}"></nav>
  <main>
    <aside th:replace="~{./fragment/aside.html}"></aside>
    <section>
      <form action="/contact/write" method="post">
        <div class="mt-3 mb-3">
          <label class="form-label" for="name">이름:</label>
          <input class="form-control" id="name" name="name" placeholder="이름 입력..." required type="text">
        </div>
        <div class="mt-3 mb-3">
          <label class="form-label" for="address">주소:</label>
          <textarea class="form-control" rows="5" id="address" name="address"></textarea>
        </div>
        <div class="mt-3 mb-3">
          <label class="form-label" for="tel">연락처:</label>
          <input class="form-control" id="tel" name="tel" placeholder="연락처 입력..." required type="text">
        </div>
        <div class="mt-3 mb-3">
          <button class="btn btn-success">추가</button>
        </div>
      </form>
    </section>
    <aside th:replace="~{./fragment/aside.html}"></aside>
  </main>
  <footer th:replace="~{./fragment/footer.html}"></footer>
</div>
</body>
</html>
